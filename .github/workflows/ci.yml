name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:types

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vue: [vue2, vue3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # vue-demi-switch rewrites the vue-demi shim in node_modules, which is
      # shared mutable state — hence one job per version rather than one job
      # running both.
      - run: npm run test:unit:${{ matrix.vue }}
      - run: npm run test:integration:${{ matrix.vue }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # every path declared in package.json must exist after a build
      - run: npm run verify:package
